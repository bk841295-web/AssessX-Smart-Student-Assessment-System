<!doctype html><html><head><title>Admin</title><link rel="stylesheet" href="/static/style.css"></head><body><nav><b>AssessX Admin</b><a href="/logout">Logout</a></nav><div class="container"><div class="card"><h3>Add Subject</h3><form method="post" action="/admin/add_subject"><input name="name" placeholder="Subject name" required><button>Add</button></form></div><h3>Students</h3><table><tr><th>Name</th><th>Email</th></tr>{% for u in users %}<tr><td>{{u["name"]}}</td><td>{{u["email"]}}</td></tr>{% endfor %}</table><h3>Results</h3><table><tr><th>Student</th><th>Subject</th><th>Score</th><th>%</th></tr>{% for r in results %}<tr><td>{{r["student"]}}</td><td>{{r["subject"]}}</td><td>{{r["score"]}}/{{r["total"]}}</td><td>{{r["percentage"]}}%</td></tr>{% endfor %}</table></div></body></html>
