<!doctype html><html><head><title>Test</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="container"><h2>{{subject["name"]}} Test</h2><div id="timer">10:00</div><form id="f" method="post">{% for q in questions %}<div class="card"><b>{{loop.index}}. {{q["question"]}}</b><p><label><input type="radio" name="{{q["id"]}}" value="A" required> A. {{q["a"]}}</label></p><p><label><input type="radio" name="{{q["id"]}}" value="B"> B. {{q["b"]}}</label></p><p><label><input type="radio" name="{{q["id"]}}" value="C"> C. {{q["c"]}}</label></p><p><label><input type="radio" name="{{q["id"]}}" value="D"> D. {{q["d"]}}</label></p></div>{% endfor %}<button>Submit Test</button></form></div><script>let s=600;setInterval(()=>{let m=Math.floor(s/60),x=s%60;timer.textContent=String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");if(s--<=0)f.submit()},1000)</script></body></html>
